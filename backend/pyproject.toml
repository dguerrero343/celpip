[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celpip-writing-coach-api"
version = "0.1.0"
description = "API foundation for the CELPIP Writing Coach"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==2.52.0",
  "pwdlib[argon2]==0.2.1",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
